name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(jq -r '.version' package.json)"
          git merge-base --is-ancestor HEAD origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Extract release notes
        run: |
          awk -v version="$(jq -r '.version' package.json)" '
            /^## / {
              if (found) exit
              found = $2 == "[" version "]"
              next
            }
            found {
              print
              if ($0 ~ /[^[:space:]]/) hasNotes = 1
            }
            END { if (!hasNotes) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
      - run: npm install --global npm@latest
      - run: npm publish
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md"
